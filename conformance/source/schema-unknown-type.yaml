# `bytes` is not in the type registry: bytes are a `blob`, and a type the registry does not list is
# a defect in the document, not a synonym to be guessed at.
apiVersion: utos.io/v1
kind: Workflow
metadata:
  name: resize
  version: 1.0.0
spec:
  activities:
    resize:
      type: timer
      schema:
        input:
          photo: { type: bytes }
      duration: 1s
