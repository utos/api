apiVersion: utos.io/v1
kind: Workflow
metadata:
  name: greet
  version: 1.0.0
spec:
  activities:
    say-hello:
      type: http
      method: GET
      url: https://api.example.com/hello
      onSuccess:
        - condition: "output.ok"
          return:
            greeted: true
            who: "{{ output.name }}"
