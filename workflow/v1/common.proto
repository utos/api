syntax = "proto3";

import "google/protobuf/struct.proto";

package utos.workflow.v1;

option csharp_namespace = "Utos.Workflows.V1";

// ============================================================================
// Common Types
// ============================================================================

// Why an execution failed. Reported on a failed execution, and — the same
// shape — authored as a rule's `error` action, so a workflow that decides to
// fail says exactly what the run will report.
message WorkflowError {
  // A stable identifier for the failure class, e.g. "MISSING_CUSTOMER". As an
  // authored action it is a literal (never a template) and required (UTOS-T005),
  // except in the empty re-raise form an `on_failure` rule may carry.
  string code = 1;

  // Human-readable explanation. As an authored action, a text template.
  string message = 2;

  // Additional structured details. As an authored action, a struct template.
  //
  // Stays a Struct, unlike the other values a run reports, because this
  // message is also the authored action and a bundle carries templates. Details
  // are therefore plain JSON: a blob rendered into them is UTOS-E103. An error
  // explains a failure; it does not carry a payload.
  optional google.protobuf.Struct details = 3;
}
