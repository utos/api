syntax = "proto3";

package utos.workflow.v1;

import "google/protobuf/struct.proto";
import "workflow/v1/common.proto";

option csharp_namespace = "Utos.Workflows.V1";

// ============================================================================
// Activity Definitions
// ============================================================================

// Individual workflow activity definition
message WorkflowActivity {
  // Transitions to execute after successful completion
  // Evaluated in order; first matching condition wins
  // If no transitions match or list is empty, workflow completes
  repeated TransitionRule on_success = 1;

  // Transitions to execute after a failure
  // Evaluated in order; first matching condition wins
  // If no transitions match or list is empty, the error propagates
  repeated TransitionRule on_failure = 2;

  // What this activity declares about the data crossing into it. Optional —
  // an absent schema is the empty schema, which anything the wire can carry
  // satisfies, so every workflow written before schemas existed keeps working.
  //
  // Declared here rather than inside a configuration because `input` is taken:
  // on a workflow.call activity `input` is the *child's* input, and the same
  // holds for a promise branch and a handler dispatch, so an activity's own
  // declaration cannot live under that name. Being an activity-level field
  // outside the oneof is also what keeps the source-format mapping simple —
  // step 3 of that mapping places every key it does not recognize into the
  // resolved configuration message, so a `schema` declared anywhere else would
  // land inside HttpActivityConfig.
  //
  // See docs/workflow-schemas.md.
  ActivitySchema schema = 3;

  // Activity-specific configuration — exactly one must be set
  oneof config {
    HttpActivityConfig http = 10;
    WorkflowActivityConfig workflow = 11;
    PromiseActivityConfig promise = 12;
    TimerActivityConfig timer = 13;
  }
}

// What an activity declares about the data crossing into it.
//
// A message rather than a bare `input` field so that anything else declarative
// — an activity's own limits, a retry policy — has somewhere to go without
// another field on WorkflowActivity.
//
// Only `input` is declarable. An activity's *output* shape follows from its
// kind — an http activity's is the parsed JSON body or null, a timer's is its
// input, a workflow.call's is the callee's declared `spec.output` — so it is
// derived, and authoring it would be a second place to disagree.
message ActivitySchema {
  // A JSON Schema 2020-12 document describing what this activity accepts,
  // as the value every input boundary that reaches this activity is checked
  // against: the run input when it is the start activity, a transition's
  // rendered `input` when it is the target, and a dispatched document's input
  // when it is that document's start activity.
  //
  // This is the ONLY input schema in the system, which is why it is declared
  // per activity and not once per workflow: a run is scheduled with a start
  // activity, so a document with three entry points has three input shapes and
  // a workflow-level `spec.input` would be a fiction.
  //
  // Plain JSON Schema by the time it is here. The source format's authoring
  // sugar — `?` for optional, `min`/`max`, closed by default — is compiled by
  // the front end, so a bundle carries the standard form and no consumer has to
  // learn ours. See docs/workflow-schemas.md.
  google.protobuf.Struct input = 1;
}

// One rule, in any list: an optional condition, at most one **effect** — what
// happens — and at most one **exit** — where the run goes next. A rule with
// neither is rejected (UTOS-T001).
//
// The same message serves every list, so a rule reads the same wherever it
// appears. The lists differ only in whether an exit is required: `on_success`
// and `on_failure` end the activity, so the run must go somewhere, while an
// `on_emitted` rule runs once per value and an exit is what stops consuming.
// See docs/workflow-source-format.md § Transitions.
message TransitionRule {
  // Former EmitAction `emit` (which carried its own transition) and the
  // `action` oneof that held it.
  reserved 4;

  // A bare expression that must evaluate to exactly true or false — e.g.
  // `output.count > 10` — as docs/template-expressions.md defines. Not `{{ }}`-
  // wrapped (UTOS-E061). If empty/omitted, the rule always matches (a fallback).
  // Available context: `input` (data the source activity received),
  // `output` (raw output from the source activity's execution, or the emitted
  // value in an `on_emitted` rule), `env` (the run's ambient environment map),
  // `response` and `error` — always defined, null where they do not apply.
  optional string condition = 1;

  // What this rule does. At most one, structurally rather than by rule: two
  // effects would need an order the document cannot express.
  oneof effect {
    // Append this value to the execution's output stream and carry on. Leaf
    // string values may contain {{ }} template expressions, resolved in the
    // same context as this rule's condition.
    //
    // A caller that invoked this workflow with `workflow.call` and declared
    // `on_emitted` is a privileged consumer: the emit does not complete until
    // that consumer's cursor advances past the entry, which bounds the
    // unconsumed buffer to one entry. With no privileged consumer the emit
    // completes as soon as the entry is durable. See
    // docs/execution-output-stream.md.
    google.protobuf.Struct emit = 6;

    // Run a document. In the source format the mode is part of the key, as it
    // is in an activity's `type`: `workflow.call`.
    DispatchEffect workflow = 7;
  }

  // Where the run goes when this rule matches. At most one.
  oneof exit {
    // Transition to another activity in this workflow (UTOS-T003). A target is
    // always an activity: ending a path is `result` and failing it is `error`,
    // so a name is never ambiguous.
    TransitionTarget transition = 2;

    // End this execution path, returning this value. Appends the terminal entry
    // to this execution's output stream — see docs/execution-output-stream.md.
    // An EMPTY struct ends the path with no value (GetExecution.result is unset);
    // the source format spells both as `return`.
    google.protobuf.Struct result = 3;

    // End this execution path as a failure, with this error. The run reports
    // exactly what the author wrote: `code` is a literal identifier (required,
    // UTOS-T005); `message` is a text template and `details` a struct template,
    // rendered in the same context as the condition.
    //
    // An EMPTY WorkflowError in an `on_failure` rule re-raises the failure being
    // handled, as it is — its `code`, `message` and `details` — and is legal
    // without a `code` there only. The source format spells it as a bare `error`.
    WorkflowError error = 5;
  }
}

// Running a document as an effect: the same behaviours the sub-workflow
// activity kinds have, available inside a rule.
//
// A rule that ends an activity could transition to a `workflow.call` activity
// instead; a rule that does not end one — `on_emitted` — has nowhere to
// transition to, which is why dispatch exists here at all.
message DispatchEffect {
  // Field 2 is left free for `spawn`, which starts a run without waiting for
  // it (plans: spawn-action.md).

  oneof mode {
    // Run the document and wait for it to finish, then carry on with this rule's
    // exit, if it has one. In an `on_emitted` rule this is the body of the
    // consuming loop: the call finishes one iteration and the next value is
    // taken. Formerly spelled `handle`.
    HandlerDispatch call = 1;
  }
}

// Defines the target of a transition
message TransitionTarget {
  // The name of an activity in the same workflow (UTOS-T003). Nothing else:
  // ending a path is a `result` exit and failing it an `error` exit, so there
  // are no keywords and no name is reserved.
  // The name may reference an already-visited activity — a back-edge — which
  // forms a loop (e.g. poll-inbox -> wait -> poll-inbox). A loop with no rule
  // carrying a `result` runs until the execution is cancelled, expressing an
  // intentionally infinite loop such as a poller.
  string name = 1;

  // Transform that produces the target activity's `input` context.
  // Leaf string values may contain {{ }} template expressions.
  // Available context: `input` (data the source activity received),
  // `output` (raw output from the source activity's execution),
  // `error` (why it failed, on the on_failure path),
  // `response` (the HTTP response, for an http activity, on either path),
  // `env` (the run's ambient environment map, available to every activity).
  // `error` and `response` are not in scope when the *target* activity's own
  // configuration is rendered, so anything a handler needs must be carried
  // across in this transform.
  // If omitted, the source activity's raw output passes through as-is — or, on
  // the failure path where there is no output, the failing activity's own input.
  optional google.protobuf.Struct input = 2;
}

// ============================================================================
// Activity Configurations
// ============================================================================

// Configuration for HTTP activities
// String fields support {{ input.x }} template expressions to reference
// the data this activity received (workflow input for the start activity,
// or the preceding transition's transform result for subsequent activities),
// and {{ env.x }} to reference the run's ambient environment (e.g. a base URL).
//
// An http activity surfaces its result twice, on different axes: `output` is
// the parsed JSON body when the response declared a JSON media type, and null
// otherwise, in common with every other activity kind, while `response`
// carries the transport facts — status, headers (names lowercased) and body, a
// Blob holding the bytes as received — that have no analogue on the other
// kinds. `response` is available on the failure path as well, which is what
// lets an on_failure rule tell a 429 from a 401 without an error-code taxonomy.
// A non-2xx is a failure. See docs/binary-data.md § The HTTP activity.
message HttpActivityConfig {
  // HTTP method (e.g., "GET", "POST", "PUT", "DELETE")
  string method = 1;

  // Target URL — supports {{ input.x }} templates
  string url = 2;

  // HTTP headers — values support {{ input.x }} templates.
  // Names are matched case-insensitively, as HTTP requires. Content headers
  // belong here too: a `content-type` declared here is the body's media type,
  // and defaults to "application/json" when absent. Implementations must not
  // send the body as JSON regardless — a form-encoded body is what an OAuth
  // token refresh needs, so a workflow that cannot express one cannot renew
  // its own credential.
  map<string, string> headers = 3;

  // Request body (ignored for GET/DELETE) — supports {{ input.x }} templates.
  // Rendered as text, except that a whole-field template evaluating to a Blob
  // sends that blob's bytes, and its media type when no `content-type` header
  // is declared.
  optional string body = 4;
}

// Configuration for a timer (durable delay) activity.
// Pauses this execution path for `duration`, then evaluates transitions
// normally. The activity's `input` passes through unchanged as its `output`,
// so a back-edge's TransitionTarget.input can keep threading accumulating loop
// state across the wait.
//
// Combined with a back-edge transition this expresses a polling loop, e.g.
// poll-inbox (http) -> wait (timer 60s) -> poll-inbox (back-edge).
message TimerActivityConfig {
  // Former google.protobuf.Duration `duration`, which proto3 JSON could only
  // spell in seconds ("86400s").
  reserved 1;

  // How long to pause before this activity's transitions are evaluated, in the
  // unit shorthand: `90s`, `8h`, `1h30m`, `3d` — units largest first, each at
  // most once, whole numbers, and positive (UTOS-C201, UTOS-C202, UTOS-C203).
  //
  // A whole-field {{ }} template may stand in for the literal, and must render
  // to a string in the same syntax (UTOS-E106); a number is refused, since `8`
  // says neither seconds nor hours. The rendered value is recorded in history
  // when the activity is entered, so a replay reads the same deadline.
  // See docs/workflow-source-format.md § Durations.
  string duration = 2;
}

// Configuration for sub-workflow invocation.
//
// The invocation mode is a nested oneof rather than a flag, because the choice
// changes this activity's output contract and its failure semantics — see
// CallActivityConfig and SpawnActivityConfig. In the source format the mode is
// part of the `type` discriminator path: `workflow.call` or `workflow.spawn`.
message WorkflowActivityConfig {
  // Former `bool detached` flag, replaced by the `mode` oneof below.
  reserved 4;
  reserved "detached";

  // Identifies the sub-workflow to invoke.
  // In the source format: a dependency alias — a key in this workflow's
  // WorkflowSpec.dependencies map (e.g. "emailer").
  // In the built bundle: the sub-workflow's canonical identity — a key in
  // WorkflowBundle.workflows (e.g. "registry.example.com/acme/send-email:1.0.0").
  string workflow = 1;

  // Activity within the sub-workflow to start execution at
  string start_activity = 2;

  // Input data passed to the sub-workflow
  // Leaf string values may contain {{ input.x }} and {{ env.x }} template
  // expressions. The sub-workflow execution inherits this run's ambient `env`.
  google.protobuf.Struct input = 3;

  // How the sub-workflow is invoked — exactly one must be set.
  //
  // Either way the child runs the sub-workflow content snapshotted in the
  // parent's bundle (same content lineage / digest family), not a re-resolution
  // against the current store, so it is reproducible and its recorded
  // workflow.digest derives from the parent's snapshot.
  oneof mode {
    CallActivityConfig call = 5;
    SpawnActivityConfig spawn = 6;
  }
}

// Await the sub-workflow: this activity does not complete until the child
// terminates, and the child's result becomes this activity's `output`.
// `on_failure` catches the child's runtime failures.
//
// The child's lifecycle is bound to this activity. If the parent execution is
// cancelled, or stops waiting, the child is cancelled too — its result can no
// longer be observed.
message CallActivityConfig {
  // Former `repeated EmissionRule on_emitted`, before one rule type served
  // every list.
  reserved 1;

  // Subscribes this activity to the sub-workflow's output stream: evaluated
  // once per value the child emits, in stream order, before the child's
  // terminal entry reaches `on_success`.
  //
  // Consuming is a loop and the handler is its body. Each value dispatches a
  // document, which runs to termination; that ends one iteration and this
  // activity takes the next value. A rule list where nothing matches skips that
  // value, so a filtering handler simply takes the next one.
  //
  // A handler's terminal result is discarded. It has one way to say something
  // and that is to `emit`: a handler's emissions propagate to this execution's
  // own output stream, so a value emitted inside a handler comes out of the
  // consumer, exactly as it did when the handler ran inline. Relaying needs no
  // keyword.
  //
  // The subscription ends when the consuming execution terminates — `end` or a
  // `result` — or when it is cancelled or fails. The child is cancelled with it,
  // since nothing will observe it again.
  //
  // Ordering needs no separate rule. Emitted values and the terminal result are
  // entries in one ordered stream walked by one cursor, so `on_emitted` cannot
  // race `on_success` — a fast-terminating child cannot overtake its own
  // output.
  //
  // Empty (the default) means this caller ignores emissions: it awaits only the
  // terminal entry. It is not privileged, so it does not gate the producer.
  repeated TransitionRule on_emitted = 2;
}

// Start the sub-workflow and move on immediately (fire-and-forget). The child
// runs as an independent top-level execution with its own lifecycle and may
// outlive the parent; the daemon must not tear it down when the parent ends.
//
// The activity's `output` is a handle to the started run —
// { "execution_id": "<id>" } — not the child's result, since there is nothing
// to wait for. `on_failure` only catches failures to *start* the child, not the
// child's own runtime failures, which the parent never observes.
message SpawnActivityConfig {}

// Configuration for concurrent fan-out (promise) activities.
//
// Each promise activity execution is an independent concurrency scope: its
// branch outputs do not leak across invocations. A branch may dispatch the
// document it is declared in (`workflow: self`), and may enter it at the
// promise activity itself, so nested and recursive fan-out is permitted.
// Bounding total spawned work — concurrency, recursion depth, execution budget
// — is a daemon responsibility, not a constraint of this spec.
//
// Branch emissions do not propagate to the promise's own output stream, unlike
// an emission handler's. N branches run concurrently, so interleaving their
// emissions into one stream would order them nondeterministically and cost the
// single-ordered-stream property the rest of the spec rests on. Branch
// emissions remain readable on each branch execution's own stream.
message PromiseActivityConfig {
  // Former `string mode` + `int32 required_count`, replaced by the `completion`
  // oneof below. required_count now lives on PromiseCountConfig, the only mode
  // that has ever used it.
  reserved 1, 2;
  reserved "mode", "required_count";

  // Branches to execute concurrently
  repeated PromiseBranch branches = 3;

  // Completion mode — exactly one must be set. Operates on *started* branches,
  // i.e. after condition filtering.
  //
  // Once the mode is satisfied — or, for `all`, once a branch has failed — any
  // branch still running is cancelled before the activity completes, so a
  // resolved promise means no branch of it is still spending. A branch is
  // arbitrary workflow content, and a losing `race` branch that POSTs an order
  // does so whether or not anyone can still read its result.
  //
  // Named `completion` rather than `mode` because `mode` is a reserved field
  // name in this message. In the source format the mode is part of the `type`
  // discriminator path: `promise.all`, `promise.any`, `promise.race`,
  // `promise.count`.
  oneof completion {
    PromiseAllConfig all = 4;
    PromiseAnyConfig any = 5;
    PromiseRaceConfig race = 6;
    PromiseCountConfig count = 7;
  }
}

// All started branches must succeed; fails if any branch fails.
message PromiseAllConfig {}

// Resolves on the first branch to succeed; fails if all branches fail.
message PromiseAnyConfig {}

// Resolves on the first branch to settle, success or failure; that branch's
// result propagates either way.
message PromiseRaceConfig {}

// Resolves once `required_count` branches have succeeded; fails as soon as
// enough branches have failed that the count is unreachable.
message PromiseCountConfig {
  // Number of branches that must succeed. Must be greater than zero.
  int32 required_count = 1;
}

// A single branch within a promise activity
// Supports static, conditional, and dynamic (for_each) branches
//
// A branch dispatches a *document*, not an activity: the same `workflow` /
// `start_activity` / `input` triple a HandlerDispatch carries, declared flat
// here because a branch has no alternative to disambiguate from. See
// HandlerDispatch for what a dispatch means and why both constructs agree on
// its content.
message PromiseBranch {
  // Former `TransitionTarget target`, replaced by the dispatch fields below.
  reserved 4;
  reserved "target";

  // Key in the promise output map (e.g., "pricing").
  //
  // Rendered against the branch scope, so `{{ alias.x }}` may be used with
  // for_each to name each expansion after the item it processes —
  // `addon-{{ item.sku }}` yields `addon-SKU-123`, which says which expansion
  // failed where an ordinal says nothing.
  //
  // Names must be distinct within one promise, since they key the output map.
  // Where a for_each expansion renders names that are not distinct — most
  // obviously a name with no template in it, which renders to itself every
  // time — an implementation appends `_{index}` to each of that expansion's
  // names. That fallback is what keeps a plain `name: item` over a collection
  // working, and it applies per expansion, not per promise: a templated name
  // that is already distinct is used exactly as written.
  //
  // A collision *between* branches is not disambiguated, because renaming a
  // branch the author named deliberately would be worse than refusing. Where
  // both names are literal it is UTOS-C307; where rendering produces it, it is
  // a run-time failure, since rendering needs the collection and validation
  // does not evaluate templates.
  string name = 1;

  // Optional; expands this branch once per item in the collection
  optional ForEachConfig for_each = 2;

  // Optional; skip this branch if the condition evaluates to false
  // Per-item evaluation when combined with for_each
  // May reference `env` (the run's ambient environment) alongside the branch context
  optional string condition = 3;

  // The document this branch runs. In the source format, a `spec.dependencies`
  // alias, or `self` for the document the promise is declared in; in the built
  // bundle, its canonical identity — a key in WorkflowBundle.workflows
  // (UTOS-B006). Required (UTOS-C501).
  //
  // This is the one place `self` is legal, and the reason it exists: recursive
  // fan-out is otherwise inexpressible, because a document reaching itself
  // through an alias is a cycle (UTOS-S005). Such a branch terminates on its
  // data — a for_each over an empty collection starts nothing — rather than on
  // a depth rule.
  string workflow = 5;

  // Which activity in that document the branch starts from. Required
  // (UTOS-C502), and must name an activity it declares (UTOS-C503).
  string start_activity = 6;

  // Transform producing the dispatched document's run input. Leaf string values
  // may contain {{ }} expressions, evaluated in the branch scope — the for_each
  // alias, `input`, `env`. Omitted means the promise activity's own input passes
  // through unchanged.
  optional google.protobuf.Struct input = 7;
}

// Run a document, starting from one of its activities.
//
// The same triple a PromiseBranch carries, and deliberately so: dispatching
// work is one thing to learn, whether a promise is fanning out over it or an
// emission handler is processing a value with it. Neither names an activity in
// the dispatching document; both name a document and where to enter it.
//
// A branch carries these fields flat while a rule nests them under its effect
// key, which is the one asymmetry. A branch has no alternative actions, so there
// is nothing for a wrapper to disambiguate; a rule has an effect and an exit,
// and the key is what makes the choice visible rather than something the author
// has to know from the field names.
//
// Requiring a document keeps each `spec.activities` map to one flow. Work that
// exists only to serve a branch or a handler lives in a document of its own,
// where running out of transitions finishes one iteration rather than ending a
// run, and a reader of the main flow never mistakes it for a step.
message HandlerDispatch {
  // The document to dispatch. In the source format, a `spec.dependencies`
  // alias; in the built bundle, its canonical identity (UTOS-B006). Required
  // (UTOS-C501).
  //
  // `self` is **not** legal here (UTOS-S011). A handler in another document
  // cannot transition into the dispatching flow, because transitions do not
  // cross documents; a handler in the *same* document can, and re-entering the
  // call activity that dispatched it starts a second producer rather than
  // resuming the first — once per value, without bound.
  //
  // A consumer that wants to reach its own flow says so with `transition`,
  // which is evaluated in its own execution and carries none of that risk.
  string workflow = 1;

  // Which activity in that document to start from. Required (UTOS-C502), and
  // must name an activity it declares (UTOS-C503).
  string start_activity = 2;

  // Transform producing the dispatched document's run input. Leaf string values
  // may contain {{ }} expressions. Omitted passes the dispatching context's
  // value through unchanged — for an emission handler, the emitted value.
  optional google.protobuf.Struct input = 3;
}

// Configuration for dynamic branch expansion over a collection
message ForEachConfig {
  // Template expression that resolves to an array (e.g., "{{ input.addons }}")
  // May also reference `env` (the run's ambient environment)
  string collection = 1;

  // Variable name for the current item (e.g., "item")
  string alias = 2;
}
